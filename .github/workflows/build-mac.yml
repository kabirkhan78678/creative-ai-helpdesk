name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: |
          cd desktop
          npm install

      - name: Build macOS DMG (Intel x64 and Apple Silicon arm64)
        run: |
          cd desktop
          npm run build
          npx electron-builder --mac dmg --x64 --arm64 -c.mac.identity=null

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Creative-AI-IT-Helpdesk-macOS-DMG
          path: desktop/release/*.dmg

