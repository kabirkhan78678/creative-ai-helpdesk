version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: creativeai_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: it_helpdesk_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: creativeai_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword123
      - MYSQL_DB=it_helpdesk_db
    depends_on:
      - db

volumes:
  mysql_data:

